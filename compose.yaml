services:
  postgres-auth:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: relay_ops_auth
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - db-auth:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d relay_ops_auth"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  postgres-app:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: relay_ops_app
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - db-app:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d relay_ops_app"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  rabbitmq-server:
    image: rabbitmq:4-management
    # RabbitMQ stores data per node name (rabbit@<hostname>); a fixed hostname
    # keeps the data in the volume when the container is recreated
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      RABBITMQ_DEFAULT_VHOST: relay-ops
    ports:
      - "5672:5672" # AMQP protocol
      - "15672:15672" # management
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  db-auth:
  db-app:
  rabbitmq:
    driver: local
