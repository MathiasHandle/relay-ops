name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  checks:
    name: checks and unit tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm turbo run check:lint check:format check:ts

      - name: Run build
        run: pnpm build

      - name: Run unit tests
        run: pnpm turbo run test:unit

  integration:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres-auth postgres-app

      - name: Prepare test environment
        run: |
          cp apps/auth/.env.test.example apps/auth/.env.test
          cp apps/server/.env.test.example apps/server/.env.test
          cp apps/worker/.env.test.example apps/worker/.env.test

      - name: Run integration tests
        run: pnpm turbo run test:integration
